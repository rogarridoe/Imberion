<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="eyebrow">Radii & Elevation</div>
  <div style="display:flex;gap:16px;align-items:center;margin-top:4px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:72px;height:56px;background:#fff;border-radius:2px;border:1px solid rgba(10,24,40,.12);"></div>
      <span class="meta" style="font-size:10px;">2px · radius-sm</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:72px;height:56px;background:#fff;border-radius:4px;border:1px solid rgba(10,24,40,.12);"></div>
      <span class="meta" style="font-size:10px;">4px · radius (default)</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:72px;height:56px;background:#fff;border-radius:6px;border:1px solid rgba(10,24,40,.12);"></div>
      <span class="meta" style="font-size:10px;">6px · radius-lg (max)</span>
    </div>
    <div style="width:1px;height:56px;background:rgba(10,24,40,.12);margin:0 4px;"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:72px;height:56px;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(27,42,59,.10);"></div>
      <span class="meta" style="font-size:10px;">shadow (cards)</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:72px;height:56px;background:#fff;border-radius:4px;box-shadow:0 8px 48px rgba(0,0,0,.18);"></div>
      <span class="meta" style="font-size:10px;">shadow-lg (modals)</span>
    </div>
  </div>
  <div class="meta" style="margin-top:4px;">No pill buttons. No glow. Shadows used only on product previews & modals — never buttons.</div>
</div>
</body></html>
