<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card" style="padding:28px 32px;">
  <div class="eyebrow" style="margin-bottom:14px;">Cards — Three Styles</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;">
    <div style="background:#fff;padding:20px 18px;position:relative;border-top:2px solid #6F859C;">
      <div style="font-family:var(--font-serif);font-size:2rem;line-height:1;color:#CFCBC6;font-weight:300;">A</div>
      <div style="font-family:var(--font-serif);font-size:16px;color:#0A1828;margin-top:8px;line-height:1.2;">Paper card</div>
      <div style="font-family:var(--font-sans);font-size:11px;color:rgba(10,24,40,.6);margin-top:6px;line-height:1.5;">White on beige. Top accent lights up on hover.</div>
    </div>
    <div style="background:#EDEAE4;padding:20px 18px;">
      <div style="font-family:var(--font-serif);font-size:2rem;line-height:1;color:rgba(10,24,40,.2);font-weight:300;">B</div>
      <div style="font-family:var(--font-serif);font-size:16px;color:#0A1828;margin-top:8px;line-height:1.2;">Tinted card</div>
      <div style="font-family:var(--font-sans);font-size:11px;color:rgba(10,24,40,.6);margin-top:6px;line-height:1.5;">Paper-soft. No border, no accent. Quiet grouping.</div>
    </div>
    <div style="background:#0A1828;padding:20px 18px;border:1px solid rgba(255,255,255,.08);">
      <div style="font-family:var(--font-serif);font-size:2rem;line-height:1;color:rgba(255,255,255,.15);font-weight:300;">C</div>
      <div style="font-family:var(--font-serif);font-size:16px;color:#fff;margin-top:8px;line-height:1.2;">Dark card</div>
      <div style="font-family:var(--font-sans);font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.5;">White-06 on navy. 1px white-08 border.</div>
    </div>
  </div>
</div>
</body></html>
