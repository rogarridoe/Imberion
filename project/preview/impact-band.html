<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card on-dark" style="padding:26px 32px;gap:0;">
  <div class="eyebrow" style="color:rgba(143,163,184,.7);margin-bottom:18px;">Impact Band — 4-Col Stats</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;">
    <div style="padding:18px 14px;border-top:2px solid rgba(255,255,255,.5);">
      <div><span style="font-family:var(--font-sans);font-size:2.2rem;font-weight:300;letter-spacing:-0.02em;line-height:1;color:#ffffff;font-variant-numeric:lining-nums tabular-nums;">2–5</span><span style="font-family:var(--font-sans);font-size:1.1rem;font-weight:300;color:#ffffff;margin-left:2px;">%</span></div>
      <div style="font:400 11px/1.5 var(--font-sans);color:rgba(255,255,255,.7);margin-top:8px;">Margin recovery through pricing discipline.</div>
    </div>
    <div style="padding:18px 14px;border-top:2px solid rgba(255,255,255,.5);">
      <div><span style="font-family:var(--font-sans);font-size:2.2rem;font-weight:300;letter-spacing:-0.02em;line-height:1;color:#ffffff;font-variant-numeric:lining-nums tabular-nums;">15–30</span><span style="font-family:var(--font-sans);font-size:1.1rem;font-weight:300;color:#ffffff;margin-left:2px;">%</span></div>
      <div style="font:400 11px/1.5 var(--font-sans);color:rgba(255,255,255,.7);margin-top:8px;">Of trade spend reassignable with pay-for-performance.</div>
    </div>
    <div style="padding:18px 14px;border-top:2px solid rgba(255,255,255,.5);">
      <div><span style="font-family:var(--font-sans);font-size:2.2rem;font-weight:300;letter-spacing:-0.02em;line-height:1;color:#ffffff;font-variant-numeric:lining-nums tabular-nums;">20</span><span style="font-family:var(--font-sans);font-size:1.1rem;font-weight:300;color:#ffffff;margin-left:2px;">×</span></div>
      <div style="font:400 11px/1.5 var(--font-sans);color:rgba(255,255,255,.7);margin-top:8px;">Typical ROI when intelligence reaches execution.</div>
    </div>
    <div style="padding:18px 14px;border-top:2px solid rgba(255,255,255,.5);">
      <div><span style="font-family:var(--font-sans);font-size:2.2rem;font-weight:300;letter-spacing:-0.02em;line-height:1;color:#ffffff;font-variant-numeric:lining-nums tabular-nums;">+30</span><span style="font-family:var(--font-sans);font-size:1.1rem;font-weight:300;color:#ffffff;margin-left:2px;">%</span></div>
      <div style="font:400 11px/1.5 var(--font-sans);color:rgba(255,255,255,.7);margin-top:8px;">Uplift identification from promotion value classification.</div>
    </div>
  </div>
</div>
</body></html>
