<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card on-dark" style="padding:36px 40px;gap:28px;">

  <!-- Row 1: wordmark + tagline -->
  <div style="display:flex;align-items:center;gap:32px;">
    <img src="../assets/logos/imberion-wordmark-white.png" alt="Imberion" style="height:44px;width:auto;">
    <div style="width:1px;height:40px;background:rgba(255,255,255,.1);"></div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-style:italic;font-size:22px;color:#fff;line-height:1;">From noise to signal.</div>
      <div style="font-family:'DM Sans',system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(143,163,184,.55);">Primary lockup · navy surface</div>
    </div>
  </div>

  <!-- Row 2: favicon — navy + white + size ladder -->
  <div style="display:flex;gap:20px;align-items:center;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);">
    <div style="display:flex;gap:10px;align-items:center;">
      <!-- Navy favicon on parchment chip -->
      <div style="width:54px;height:54px;border-radius:8px;background:#F6F4F0;display:flex;align-items:center;justify-content:center;">
        <img src="../assets/logos/favicon-navy.png" style="width:44px;height:44px;display:block;" alt="Favicon navy">
      </div>
      <!-- White favicon on navy chip (contrast needed against dark card bg) -->
      <div style="width:54px;height:54px;border-radius:8px;background:#0A1828;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;">
        <img src="../assets/logos/favicon-white.png" style="width:44px;height:44px;display:block;" alt="Favicon white">
      </div>
      <!-- Size ladder (navy @ 32 / 16) -->
      <div style="width:1px;height:44px;background:rgba(255,255,255,.12);margin:0 4px;"></div>
      <img src="../assets/logos/favicon-navy.png" style="width:32px;height:32px;display:block;" alt="32">
      <img src="../assets/logos/favicon-navy.png" style="width:16px;height:16px;display:block;" alt="16">
    </div>

    <div style="flex:1;font-family:'DM Sans',system-ui,sans-serif;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.02em;line-height:1.65;">
      <strong style="color:rgba(255,255,255,.85);font-weight:600;">Favicon</strong> — circle + inline signal glyph, in
      <em style="font-style:italic;color:rgba(255,255,255,.75);">azul</em> (<code style="font-family:ui-monospace;font-size:10px;">#0A1828</code>) and
      <em style="font-style:italic;color:rgba(255,255,255,.75);">blanco</em>. Never separate glyph from circle.
      Titles use Cormorant Garamond; body uses DM Sans.
    </div>
  </div>
</div>
</body></html>
